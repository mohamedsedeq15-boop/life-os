<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f7d5b">
<title>Life OS</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf9; --panel2:#f1eee6; --ink:#24292f; --muted:#6b7280; --line:#e4dfd3;
  --accent:#2f7d5b; --accent-ink:#fff; --warn:#b26a00; --bad:#b3261e; --ok:#2f7d5b; --info:#3b6aa0;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04); --r:12px;
  --font:"Segoe UI","Noto Naskh Arabic","Noto Sans Arabic",Tahoma,"Geeza Pro",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15181b; --panel:#1d2125; --panel2:#252a2f; --ink:#e7e3da; --muted:#9aa3ad; --line:#30363d;
  --accent:#4fae85; --accent-ink:#0d1a14; --warn:#e0a03a; --bad:#ef6b62; --ok:#4fae85; --info:#7aa7dc; --shadow:none; } }
:root[data-theme="dark"]{ --bg:#15181b; --panel:#1d2125; --panel2:#252a2f; --ink:#e7e3da; --muted:#9aa3ad; --line:#30363d;
  --accent:#4fae85; --accent-ink:#0d1a14; --warn:#e0a03a; --bad:#ef6b62; --ok:#4fae85; --info:#7aa7dc; --shadow:none; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--panel);border-inline-start:0;border-inline-end:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:18px;padding:6px 10px 14px;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--panel2)} .nav a.on{background:var(--accent);color:var(--accent-ink)}
.nav .n{width:22px;text-align:center;color:var(--muted);font-size:12px} .nav a.on .n{color:inherit}
.main{min-width:0;padding:18px 22px 80px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:20px;margin:0;flex:1}
.menu-btn{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.big{font-size:28px;font-weight:700;line-height:1.2}
.muted{color:var(--muted)} .small{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.97)} .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.ghost{background:transparent} .btn.danger{color:var(--bad)} .btn.sm{padding:2px 8px;font-size:12.5px}
.btn.lg{padding:12px 18px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{list-style:none;margin:0;padding:0}
.list li{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:flex-start}
.list li:last-child{border-bottom:0}
.tl{display:flex;flex-direction:column;gap:4px}
.blk{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:9px;background:var(--panel2);border-inline-start:4px solid var(--c,#999)}
.blk.past{opacity:.55} .blk.now{outline:2px solid var(--accent)} .blk.done .t{text-decoration:line-through;color:var(--muted)}
.blk .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;direction:ltr;text-align:right}
.tag{font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.fixed{color:var(--info)} .tag.hard{color:var(--accent)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px}
.tblwrap{overflow:auto}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
textarea{width:100%;min-height:70px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
label.f>*{color:var(--ink);font-size:14px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;align-items:end}
.energy{display:flex;gap:6px} .energy button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700}
.energy button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden} .bar>i{display:block;height:100%;background:var(--accent)}
.bar.warn>i{background:var(--warn)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center}
.ring>span{width:74px;height:74px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:700;font-size:20px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:3px}
.qgrid i{display:block;height:22px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font-style:normal;font-size:9px;text-align:center;line-height:20px;color:var(--muted);cursor:pointer}
.qgrid i.near{border-color:#7fb79a} .qgrid i.new{border-color:#d7b46a} .qgrid i.far{border-color:#8ea6c9}
.qgrid i.l-good{background:#2f7d5b;color:#fff} .qgrid i.l-mid{background:#d7a740;color:#222} .qgrid i.l-weak{background:#c0574d;color:#fff}
.diff li .k{font-weight:600}
.diff .added{color:var(--ok)} .diff .removed,.diff .postponed{color:var(--bad)} .diff .moved{color:var(--info)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(640px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
.fab{position:fixed;bottom:18px;inset-inline-end:18px;z-index:40}
.chat{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;margin-bottom:8px}
.chat .q{align-self:flex-start;background:var(--panel2);padding:6px 10px;border-radius:10px}
.chat .a{align-self:flex-end;background:color-mix(in srgb,var(--accent) 12%,var(--panel));padding:8px 12px;border-radius:10px;white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:13px}
.cf{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.cf.resolved{opacity:.6}
.chartbox{position:relative;height:260px}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}
pre.rep{white-space:pre-wrap;font-family:inherit;background:var(--panel2);padding:12px;border-radius:10px;margin:0}
@media (max-width:1000px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){
  .app{grid-template-columns:1fr} .side{position:fixed;inset-block:0;inset-inline-start:0;width:250px;z-index:45;transform:translateX(100%);transition:transform .2s}
  .side.open{transform:none} .menu-btn{display:inline-block} .main{padding:12px 16px 90px}
  .g2,.g3,.g4{grid-template-columns:1fr} .blk{grid-template-columns:78px 1fr} .blk .act{grid-column:1/-1}
}
@media print{ .side,.top .btn,.fab,.noprint{display:none!important} .app{display:block} .card{break-inside:avoid;box-shadow:none} body{background:#fff;color:#000} }

.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk-day{border:1px solid var(--line);border-radius:8px;padding:6px;min-height:160px;background:var(--panel2)}
.wk-day.is-today{outline:2px solid var(--accent)}
.wk-h{font-weight:700;font-size:13px;margin-bottom:4px}
.wk-it{font-size:12px;padding:2px 5px;margin-bottom:3px;background:var(--panel);border-radius:4px;line-height:1.4}
.print-only{display:none}
@media (max-width:760px){ .wk{grid-template-columns:1fr} .wk-day{min-height:0} }
@media print{ @page{size:A4 landscape;margin:8mm} .print-only{display:block} .main>*:not(#view){display:none} #view>.card:not(.printable){display:none} .wk-day{min-height:120mm} .wk-it{font-size:10px} a{color:inherit;text-decoration:none} }

</style>
</head>

  V.phd = () => {

    const pp = S.postponements.filter(p => { const t = S.tasks.find(x => x.id === p.instance.split('@')[0]); return t && t.projectRef === phd.id; });

    return `<div class="grid g2">

        <form id="ms-form" class="row" style="margin-top:8px"><input type="text" name="name" placeholder="مرحلة جديدة" required><input type="date" name="due"><button class="btn">إضافة</button></form></div>

      <div class="card"><h2>لماذا لا تتقدم؟</h2><div class="small">${esc(E.assistant(S, 'لماذا لا أتقدم في المشروع العلمي؟', nowStamp()))}</div>${pp.length ? `<div class="muted small" style="margin-top:6px">آخر تأجيل: ${esc(pp[pp.length - 1].reason)}</div>` : ''}${files.length ? `<div class="small" style="margin-top:8px">ملف الخطة في Drive: ${files.map(f => esc(f)).join('، ')}</div>` : ''}</div>

  V.quran = () => {

      if (f.dataset.form === 'q-ctodo') S.charity.todo.push({ id: E.uid('ct'), title: v.title, done: false });
      if (f.dataset.form === 'q-research') S.work2.research.push({ id: E.uid('rs'), title: v.title, amount: +v.amount || 0, received: false });
      if (f.dataset.form === 'q-device') { const W = S.work2, dv = v.device.trim(); if (dv && !W.deviceTypes.includes(dv)) W.deviceTypes.push(dv); W.devices.push({ id: E.uid('dv'), device: dv, client: v.client, delivered: false, profit: +v.profit || 0 }); }
      if (/^q-/.test(f.dataset.form)) { closeModal(); toast('اتسجل'); }
      if (f.dataset.form === 'gcid') { S.settings.googleClientId = v.gcid.trim(); toast('اتحفظ'); }
      if (f.dataset.form === 'sleep') E.logSleep(S, today(), { slept: v.slept, woke: v.woke, nap: v.nap === 'on' });
      if (f.dataset.form === 'qpos') S.qplan.ismailPos = Math.max(1, Math.min(604, +v.pos || S.qplan.ismailPos));
      if (f.dataset.form === 'exp-add') S.charity.expenses.push({ date: v.date, caseIdx: +v.caseIdx, amount: +v.amount, note: v.note });
      save(); render(); return; }
    if (f.id === 'task-form') { e.preventDefault(); const days = new FormData(f).getAll('rd').map(Number);
      S.tasks.push({ id: E.uid('t'), title: v.title, area: v.area, duration: +v.duration, priority: +v.priority, energy: v.energy, due: v.due || null, projectRef: v.projectRef || null, recurrence: days.length ? { days } : null, status: 'active', source: 'يدوي' }); save(); render(); toast('أُضيفت المهمة'); }
    else if (f.id === 'ms-form') { e.preventDefault(); const phd = Object.values(S.projects).find(p => p.name === 'المشروع العلمي'); S.milestones[phd.id].push({ id: E.uid('ms'), name: v.name, due: v.due || null, done: false }); save(); render(); }
    else if (f.id === 'income-form') { e.preventDefault(); S.income.push({ id: E.uid('in'), date: v.date, source: v.source, amount: +v.amount, note: v.note }); save(); render(); }
    else if (f.id === 'fam-form') { e.preventDefault(); S.familyNotes.push({ text: v.text, date: today(), done: false }); save(); render(); }
    else if (f.id === 'energy-form') { e.preventDefault(); E.addEnergy(S, { date: v.date, time: v.time, level: +v.level, sleepHours: v.sleepHours === '' ? null : +v.sleepHours, note: v.note }); save(); render(); toast('حُفظ'); }
    else if (f.id === 'settings-form') { e.preventDefault(); const st = S.settings; Object.assign(st, { city: v.city, lat: +v.lat, lon: +v.lon, dayStart: v.dayStart, sleepTime: v.sleepTime, minSleepHours: +v.minSleepHours, maxDailyTasks: +v.maxDailyTasks });
      st.quran.weekdayStart = v.q1; st.quran.weekendStart = v.q2; st.quran.minutes = +v.qm; st.work.minutesPerDay = +v.wm; save(); render(); toast('حُفظت الإعدادات؛ ولّد خطة جديدة لتطبيقها'); }
    else if (f.id === 'newev-form') { e.preventDefault(); const st = v.start.replace(' ', 'T').slice(0, 16), d = new Date(st); d.setMinutes(d.getMinutes() + (+v.minutes));
      S.outbox.push({ id: E.uid('ob'), target: 'gcal', action: 'create', status: 'pending', createdAt: new Date().toISOString(), summary: `إنشاء موعد «${v.title}» ${st.replace('T', ' ')}`, payload: { title: v.title, start: st, end: E.localStamp(d) } }); save(); render(); }
  });
  async function approveOutbox(id) {
    const o = S.outbox.find(x => x.id === id); if (!o) return;
    try {
      const r = await fetch('api/calendar/' + o.action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ approved: true }, o.payload)) });
      const j = await r.json(); if (!r.ok || j.error) throw new Error(j.error || r.status);
      o.status = 'sent'; o.result = j; S.sync.log.unshift({ id: E.uid('sync'), at: new Date().toISOString(), source: 'Google Calendar', action: 'كتابة بموافقتك', counts: { sent: 1 }, details: [o.summary] });
      save(); render(); toast('أُرسل إلى التقويم');
    } catch (e) { toast('لم يُرسل: ' + e.message); }
  }
  window.addEventListener('hashchange', render);
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ------------------------------------------------------------- shell
  function updateSaveBadge() { const b = $('#savebadge'); if (b) { b.className = 'pill ' + (Store.error ? 'bad' : 'ok'); b.textContent = Store.error || 'محفوظ'; } }
  function render() {
    while (charts.length) charts.pop().destroy();
    const r = route(), q = new URLSearchParams(location.hash.split('?')[1] || ''), sec = SECTIONS.find(s => s[0] === r) || SECTIONS[0];
    const navOn = MAIN.some(m => m[0] === sec[0]) ? sec[0] : sec[0] === 'goals2' || sec[0] === 'report' || sec[0] === 'file' || sec[0] === 'appts' || ['quran', 'phd', 'books', 'work', 'projects', 'family', 'health'].includes(sec[0]) ? 'files' : sec[0] === 'day' ? 'today' : sec[0] === 'reports' || sec[0] === 'time' ? 'report' : 'today';
    $('#nav').innerHTML = MAIN.map(([id, name]) => `<a href="#${id}" class="${id === navOn ? 'on' : ''}"><span class="n">${NAV_ICON[id]}</span>${name}</a>`).join('');
    $('#title').textContent = sec[0] === 'file' ? ((E.FILES.find(f => f.id === q.get('f')) || {}).name || 'الملف') : sec[1];
    $('#today').textContent = `${fmtDate(today())} · ${nowStamp().slice(11, 16)}`;
    let html; try { html = V[sec[0]](q); } catch (err) { console.error(err); html = `<div class="card"><h2>تعذر عرض القسم</h2><pre class="small">${esc(err.stack || err)}</pre></div>`; }
    $('#view').innerHTML = html;
    $('.side').classList.remove('open');
    updateSaveBadge();
  }
  async function boot() {
    try { const th = localStorage.getItem('lifeos-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { }
    document.body.innerHTML = `<div class="app"><aside class="side"><div class="brand"><span class="dot"></span>Life OS</div><nav class="nav" id="nav" aria-label="الأقسام"></nav></aside>
      <main class="main"><div class="top"><button class="btn menu-btn" data-a="menu" aria-label="القائمة">☰</button><h1 id="title"></h1><span class="pill" id="today"></span><span class="pill" id="savebadge">…</span></div><div id="view"></div></main></div>
      <button class="btn primary fab" data-a="assistant">المساعد</button>`;
    await Store.open();
    const gBack = takeGoogleReturn();
    S = E.bootstrap(await Store.load(), SNAP);
    save(); render();
    if (gBack) syncCalendarLive();
    setInterval(() => { if (!$('#modal') && route() === 'home') render(); }, 60000);
    if ((Store.mode === 'server' || location.protocol === 'https:') && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { }); // installed copy works offline
    window.addEventListener('pagehide', () => { try { S.savedAt = new Date().toISOString(); localStorage.setItem('lifeos-state', JSON.stringify(S)); } catch (e) { } });
    window.__lifeos = { get state() { return S; }, E, Store, render };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
