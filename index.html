html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info);text-decoration-thickness:1px;text-underline-offset:3px}
strong,b{font-weight:600}
.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
.side{background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:17px;padding:4px 10px 18px;display:flex;align-items:center;gap:9px;letter-spacing:.01em}
.brand .dot{width:9px;height:9px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:14.5px;font-weight:500}
.nav a:hover{background:var(--panel2)} .nav a.on{background:color-mix(in srgb,var(--accent) 11%,var(--panel));color:var(--accent);font-weight:600}
.nav .n{width:20px;text-align:center;color:var(--muted);font-size:13px} .nav a.on .n{color:inherit}
.main{min-width:0;padding:22px 28px 90px;max-width:1180px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
.top h1{font-size:22px;font-weight:700;margin:0;flex:1;display:flex;align-items:center;gap:10px;letter-spacing:-.005em}
.top[data-s]:not([data-s=""]) h1::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--sc)}
.menu-btn,.btn.menu-btn{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 11px;border-radius:99px;background:var(--panel);color:var(--muted);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0;position:relative}
.card[data-s],#view[data-s]:not([data-s=""]) .card{border-top:3px solid var(--sc)}
.card h2{font-size:15.5px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.card[data-s] h2,#view[data-s]:not([data-s=""]) .card h2{color:color-mix(in srgb,var(--sc) 78%,var(--ink))}
.card h2 .sp{flex:1}
.card.intro{background:color-mix(in srgb,var(--sc,var(--accent)) 5%,var(--panel));margin-bottom:14px}
.stat{font-size:13px;font-weight:500;color:var(--muted)} .stat strong{color:var(--ink);font-size:15px}
.big{font-size:28px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);background:var(--panel);padding:6px 13px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel2)} .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.card[data-s] .btn.primary,#view[data-s]:not([data-s=""]) .btn.primary{background:var(--sc);color:#fff}
.btn.ghost{background:transparent;border-color:transparent} .btn.ghost:hover{background:var(--panel2)} .btn.danger{color:var(--bad)} .btn.sm{padding:3px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:12px 18px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{list-style:none;margin:0;padding:0}
.list li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.list li:last-child{border-bottom:0}
.tl{display:flex;flex-direction:column;gap:6px}
.blk{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--panel2);border:1px solid transparent;border-inline-start:3px solid var(--c,#999)}
.blk.past{opacity:.55} .blk.now{background:var(--panel);border-color:var(--line2);border-inline-start-color:var(--c,#999);box-shadow:0 0 0 2px color-mix(in srgb,var(--c,var(--accent)) 30%,transparent)}
.blk .ra{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:wrap} .blk .more{padding:3px 10px;font-weight:700;letter-spacing:1px} .removed{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.blk .t{font-weight:500} .blk.done .t{text-decoration:line-through;color:var(--muted)}
.blk .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;direction:ltr;text-align:right}
.tag{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-weight:500}
.tag[data-s]{background:color-mix(in srgb,var(--sc) 10%,var(--panel));border-color:transparent;color:var(--sc)}
.tag.fixed{color:var(--info)} .tag.hard{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px}
.tblwrap{overflow:auto}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:6px 9px;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sc,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--sc,var(--accent)) 18%,transparent)}
input[type=checkbox]{accent-color:var(--sc,var(--accent));width:17px;height:17px;margin:0;flex:none}
textarea{width:100%;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
label.f>*{color:var(--ink);font-size:14px;font-weight:400}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;align-items:end}
.energy{display:flex;gap:6px} .energy button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700}
.energy button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.bar{height:7px;background:color-mix(in srgb,var(--sc,var(--accent)) 12%,var(--panel2));border-radius:99px;overflow:hidden} .bar>i{display:block;height:100%;background:var(--sc,var(--accent));border-radius:99px}
.bar.warn>i{background:var(--warn)}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center;flex:none}
.ring>span{width:72px;height:72px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:700;font-size:19px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:3px}
.qgrid i{display:block;height:22px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font-style:normal;font-size:9px;text-align:center;line-height:20px;color:var(--muted);cursor:pointer}
.qgrid i.near{border-color:#7fb79a} .qgrid i.new{border-color:#d7b46a} .qgrid i.far{border-color:#8ea6c9}
.qgrid i.l-good{background:#2e7d62;color:#fff} .qgrid i.l-mid{background:#d1a441;color:#222} .qgrid i.l-weak{background:#b85046;color:#fff}
.diff li .k{font-weight:600}
.diff .added{color:var(--ok)} .diff .removed,.diff .postponed{color:var(--bad)} .diff .moved{color:var(--info)}
.modal{position:fixed;inset:0;background:rgba(15,18,20,.4);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.fab{position:fixed;bottom:18px;inset-inline-end:18px;z-index:40}
.chat{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;margin-bottom:8px}
.chat .q{align-self:flex-start;background:var(--panel2);padding:6px 10px;border-radius:10px}
.chat .a{align-self:flex-end;background:color-mix(in srgb,var(--accent) 12%,var(--panel));padding:8px 12px;border-radius:10px;white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:500;transition:background .15s}
.chips button:hover{background:color-mix(in srgb,var(--sc,var(--accent)) 7%,var(--panel))}
.chips button.on{background:var(--sc,var(--accent));color:#fff;border-color:transparent}
.cf{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.cf.resolved{opacity:.6}
.chartbox{position:relative;height:260px}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}
pre.rep{white-space:pre-wrap;font-family:inherit;background:var(--panel2);padding:12px;border-radius:10px;margin:0}
/* quick entry: one group per section */
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hub-g{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--sc) 4%,var(--panel));border-inline-start:3px solid var(--sc)}
.hub-h{font-size:12.5px;font-weight:700;margin-bottom:8px} .hub-h a{color:var(--sc);text-decoration:none}
.hub-g .chips button{border-color:color-mix(in srgb,var(--sc) 30%,var(--line))}
.kpi{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:13px;color:var(--ink2);text-decoration:none;font-variant-numeric:tabular-nums} .kpi strong{color:var(--ink)}
.chips.todo{margin-top:8px} .chips.todo button{font-size:12.5px;border-style:dashed}
/* sleep */
.sl-list{margin-bottom:10px} .sl-n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:color-mix(in srgb,var(--sc) 12%,var(--panel));color:var(--sc);font-weight:700;flex:none}
.sl-t{font-weight:600;font-variant-numeric:tabular-nums;min-width:120px}
.sl-form{align-items:flex-end}
/* scholarly projects */
.pj-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.pj-title{flex:1;font-size:16px!important;font-weight:700;border-color:transparent!important;background:transparent!important;padding-inline:2px!important;color:color-mix(in srgb,var(--sc) 78%,var(--ink))}
.pj-title:focus{border-color:var(--line2)!important;background:var(--panel)!important}
.pj-st{font-size:13px;font-weight:600} .pj-st.st-active{color:var(--ok)} .pj-st.st-paused{color:var(--muted)} .pj-st.st-done{color:var(--sc)}
.pj.is-paused{background:repeating-linear-gradient(135deg,var(--panel),var(--panel) 12px,var(--panel2) 12px,var(--panel2) 13px)}
.pj.is-paused .steps,.pj.is-paused .pbar{opacity:.75}
.pbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.pj-time{margin-top:10px;color:var(--ink2);background:var(--panel2);padding:6px 10px;border-radius:9px}
.steps{list-style:none;margin:12px 0 0;padding:0;counter-reset:st}
.steps li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);counter-increment:st}
.steps li:not(.empty)::before{content:counter(st,arabic-indic);width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--sc) 11%,var(--panel));color:var(--sc)}
.steps li.is-done::before{content:"✓";background:var(--sc);color:#fff}
.step .chk{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;min-width:0}
.step.is-done .chk span{text-decoration:line-through;color:var(--muted)}
.step select{font-size:12.5px;padding:3px 6px}
.st-tools{display:flex;gap:0}
.st-add{margin-top:10px}
.pj-mini{padding:8px 0;border-bottom:1px solid var(--line)} .pj-mini:last-of-type{border-bottom:0}
.pj-mini .bar{margin:6px 0 4px}
/* Quran element on «اليوم»: three sections side by side + Ramadan counter */
.q-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.q-ring{--rc:var(--ok);width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-content:center;text-align:center;border:5px solid var(--rc);background:color-mix(in srgb,var(--rc) 9%,var(--panel));line-height:1.1}
.q-ring strong{font-size:20px;color:var(--rc)} .q-ring span{font-size:11px;color:var(--muted)}
.q-ring.bad{--rc:var(--bad)}
.q-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qc{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel2);min-width:0}
.qc-h{display:flex;flex-direction:column;line-height:1.3} .qc-h strong{color:color-mix(in srgb,var(--sc) 80%,var(--ink))}
.qc-when{font-size:11.5px;color:var(--ink2);margin-top:2px}
.qc-lv{display:flex;gap:4px} .qc-lv button{flex:1;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:2px 0;font-size:12px;cursor:pointer}
.qc-lv button.on{color:#fff;border-color:transparent} .qc-lv .lv-good{background:var(--ok)} .qc-lv .lv-mid{background:var(--warn)} .qc-lv .lv-weak{background:var(--bad)}
.qc-amt{font-weight:600;font-size:15px;line-height:1.5;flex:1}
.qc-tag{font-size:11.5px;color:var(--muted)} .qc-tag.ok{color:var(--ok);font-weight:600} .qc-tag.bad{color:var(--bad);font-weight:600}
.qc.st-done{background:color-mix(in srgb,var(--ok) 8%,var(--panel));border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.qc.st-late{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 5%,var(--panel))}
.qc-btns{display:flex;gap:6px} .qc-btns .btn{flex:1;justify-content:center}
.qc .btn.ghost{border-color:var(--line2)}
.qc-did{color:var(--ok);display:flex;flex-direction:column;gap:2px}
.q-hrow{display:flex;gap:8px;align-items:baseline;justify-content:space-between;padding:2px 0} .q-hrow .linkbtn{flex:none;font-size:12px}
.qc-next{display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--line,rgba(127,127,127,.35));padding-top:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;align-self:flex-start}
.qc-foot{font-size:11.5px}
@media (max-width:760px){ .q-cols{gap:6px} .qc{padding:8px 7px} .qc-amt{font-size:13.5px} .qc-btns{flex-direction:column} .qc .btn{white-space:normal;font-size:12.5px;padding:5px 6px} }
@media (max-width:1000px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){
  html,body{font-size:15px}
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:auto 0;inset-inline:0;top:auto;height:auto;width:auto;z-index:45;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-inline-end:0;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.05)}
  .brand{display:none} .nav{grid-template-columns:repeat(5,1fr);gap:2px}
  .nav a{flex-direction:column;gap:1px;padding:5px 2px;font-size:11.5px;justify-content:center;text-align:center} .nav .n{font-size:16px;width:auto}
  .menu-btn{display:none!important} .main{padding:14px 14px 96px}
  .top h1{font-size:19px}
  .fab{bottom:78px}
  .g2,.g3,.g4,.hub{grid-template-columns:1fr} .blk{grid-template-columns:78px 1fr} .blk .act{grid-column:1/-1} .blk .ra{grid-column:1/-1}
  .card{padding:14px}
  .g2.keep{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} .g2.keep .ring{width:72px;height:72px} .g2.keep .ring>span{width:56px;height:56px;font-size:16px}
  .goals-list li{flex-wrap:wrap;gap:4px 8px} .goals-list li>span:last-child{flex-basis:100%;padding-inline-start:4px}
}
@media print{ .side,.top .btn,.fab,.noprint{display:none!important} .app{display:block} .card{break-inside:avoid;box-shadow:none} body{background:#fff;color:#000} }

.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk-day{border:1px solid var(--line);border-radius:10px;padding:7px;min-height:160px;background:var(--panel2)}
.wk-day.is-today{outline:2px solid var(--accent)}
.wk-h{font-weight:700;font-size:13px;margin-bottom:4px}
.wk-it{font-size:12px;padding:2px 5px;margin-bottom:3px;background:var(--panel);border-radius:4px;line-height:1.4}
.print-only{display:none}
@media (max-width:760px){ .wk{grid-template-columns:1fr} .wk-day{min-height:0} }
@media print{ @page{size:A4 landscape;margin:8mm} .print-only{display:block} .main>*:not(#view){display:none} #view>.card:not(.printable){display:none} .wk-day{min-height:120mm} .wk-it{font-size:10px} a{color:inherit;text-decoration:none} }
/* system map (settings) */
.smap{display:grid;gap:10px;position:relative}
.smap .tier{display:grid;gap:8px}
.smap .lbl{font-size:11.5px;letter-spacing:.02em;color:var(--muted);font-weight:600}
.smap .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.smap .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.smap .nd{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative;overflow:hidden}
.smap .nd::before{content:"";position:absolute;inset-block-start:0;inset-inline:0;height:3px;background:var(--c,var(--accent))}
.smap .nd b{display:block;font-size:14px} .smap .nd span{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.smap .core{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),var(--panel));border:1.5px solid var(--accent);border-radius:16px;padding:14px}
.smap .core>b{font-size:17px;display:flex;align-items:center;gap:8px} .smap .core>b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.smap .core .row2{margin-top:8px} .smap .core .nd{background:var(--panel)}
.smap .arw{display:flex;justify-content:center;color:var(--muted);font-size:12px;gap:6px;align-items:center}
.smap .arw::before,.smap .arw::after{content:"";height:1px;flex:1;max-width:80px;background:var(--line)}
.smap .chips2{display:flex;flex-wrap:wrap;gap:6px} .smap .chips2 i{font-style:normal;font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);border-inline-start:4px solid var(--c)}
.smap .casc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px} .smap .casc i{font-style:normal;padding:3px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)} .smap .casc em{font-style:normal;color:var(--muted)}
.smap ol{list-style:arabic-indic;margin:0;padding-inline-start:18px;font-size:13px;display:grid;gap:3px}
@media (max-width:560px){ .smap .row3{grid-template-columns:1fr} }
/* v6: ideas, calendar, command box, prices */
.chip{display:inline-flex;align-items:center;gap:4px;cursor:pointer;border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:500;color:inherit;text-decoration:none}
.chip.on{background:var(--sc,var(--accent));color:#fff;border-color:transparent} .chip input{margin:0}
.cmdp{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}

.btn.mic{font-size:18px;padding:4px 10px} .btn.mic.on{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
ol.price{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-size:14px} ol.price .list{margin-top:4px}
.calw{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calw .cd{border:1px solid var(--line);border-radius:10px;padding:6px;min-height:120px;display:flex;flex-direction:column;gap:4px}
.calw .cd.now,.calm .cm.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.calw .ch{font-weight:600;font-size:13px;color:var(--muted)}
.cev{font-size:12.5px;padding:4px 6px;border-radius:7px;background:var(--bg);border-inline-start:3px solid var(--sc,var(--info));line-height:1.35}
.cev .tm{color:var(--muted);font-size:11.5px}
.calm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calm .cwh{font-size:12px;color:var(--muted);text-align:center}
.calm .cm{border:1px solid var(--line);border-radius:8px;padding:4px;min-height:74px;display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none;overflow:hidden}
.calm .cm.out{opacity:.45} .calm .cm b{font-size:12.5px}
.calm .cm i{font-style:normal;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--bg);border-radius:4px;padding:0 3px}
@media (max-width:760px){ .nav{grid-template-columns:repeat(6,1fr)!important} .nav a{font-size:10.5px}
  .calw{grid-template-columns:1fr} .calw .cd{min-height:0} .calm .cm{min-height:54px} .calm .cm i{display:none} }
.calm .cnt{display:none} @media (max-width:760px){ .calm .cnt{display:inline-block;align-self:flex-start;font-size:10.5px;background:var(--accent);color:#fff;border-radius:99px;padding:0 6px} }
.tag.linkish{cursor:pointer;font-family:inherit}
.wirds{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.wd{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:8px 10px;cursor:pointer;font:inherit;color:inherit}
.wd b{font-size:14px;font-weight:600} .wd span{font-size:12px;color:var(--muted)}
.wd.on{background:color-mix(in srgb,var(--sc,var(--accent)) 12%,var(--panel));border-color:var(--sc,var(--accent))} .wd.on b{color:var(--sc,var(--accent))}
@media (max-width:760px){ .wirds{grid-template-columns:repeat(2,minmax(0,1fr))} }
.sym{font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",serif;font-weight:400}
.days{display:inline-flex;gap:2px} .days label{display:inline-flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--muted)} .days input{margin:0}
.stu{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
fieldset.rng{border:1px solid var(--line);border-radius:10px;padding:6px 10px 10px;margin:0} fieldset.rng legend{font-size:13px;font-weight:600;padding:0 4px}
/* Google Tasks card on Today (gtasks.js) */
.gt-l{margin-top:8px}
.gt-i .chk{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;min-width:0}
.gt-i.is-done .chk span{text-decoration:line-through;color:var(--muted)}
.gt .tag.gt-late{border-color:var(--bad,#c0392b);color:var(--bad,#c0392b)}
.gt .linkbtn{margin-top:6px}
.blk[data-a="blk-menu"]{cursor:pointer}.blk[data-a="blk-menu"]:active{filter:brightness(.97)}
/* v8: «الأعمال» fields */
.bz .bz-h { font-weight: 600; margin-top: 10px; }
.bz .bz-grp { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
.bz .bz-more { margin-top: 10px; }
.bz .bz-more > summary { cursor: pointer; }
.bz .card { box-shadow: none; border: 0; padding: 0; margin-top: 6px; background: transparent; }
.bz li.bz-done > span { text-decoration: line-through; opacity: .6; }
.bz ul.list > li.bzg { padding: 10px 12px; margin: 10px 0; border: 1px solid var(--line); border-inline-start: 5px solid var(--gc); border-radius: 10px; background: color-mix(in srgb, var(--gc) 6%, transparent); }
.bz ul.list > li.bzg > .row strong { color: var(--gc); }
.bz .bz-steps { list-style: none; margin: 6px 0 0; padding: 0 14px 0 0; display: grid; gap: 4px; }
.bz .bz-steps li { display: flex; align-items: center; gap: 6px; }
.bz .bz-steps li.bz-done span { text-decoration: line-through; opacity: .6; }
.bz .bz-steps .linkbtn { opacity: .5; }
/* المساعد: تسجيل + اقتراحات (24 Nov) */
.ast{padding:10px 0}.ast+.ast{border-top:1px solid var(--line);margin-top:6px}.ast h3{margin:0 0 2px;font-size:15px}
.sugs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sug{text-align:start;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-weight:500;color:inherit}
.sug::before{content:'؟ ';color:var(--accent)} .sug.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.sa{background:var(--panel2);border-radius:10px;padding:8px 12px;margin-top:-2px;line-height:1.7}
/* المحاسبة */
.review h3{font-size:14px;margin:0 0 4px}.rv{margin:0;padding-inline-start:18px;line-height:1.8}
.rv.good li::marker{content:'+ ';color:var(--ok)}.rv.bad li::marker{content:'− ';color:var(--bad)}
.rv-f{margin-top:10px;font-size:14px}.rv-focus{margin-top:10px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.rv.tips{margin-top:8px}

.qm-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qm-tools input{flex:1;min-width:140px}
.qm-list{display:flex;flex-direction:column;gap:6px}
.qm-s{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.qm-s>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.qm-s>summary::-webkit-details-marker{display:none}
.qm-s>summary::before{content:'‹';color:var(--muted);transition:transform .15s;display:inline-block}
.qm-s[open]>summary::before{transform:rotate(-90deg)}
.qm-s[open]>summary{border-bottom:1px solid var(--line)}
.qm-n{color:var(--muted);font-size:12px;min-width:22px;font-variant-numeric:tabular-nums}
.qm-sp{flex-basis:100%;font-size:12.5px;color:var(--muted);padding-inline-start:30px}
.qm-body{padding:6px 10px 10px}
.qm-j{margin-top:8px}
.qm-jh{font-weight:700;color:var(--sc,var(--accent));font-size:14px;display:flex;gap:6px;align-items:baseline}
.qm-h{margin:6px 0 0;padding-inline-start:10px;border-inline-start:2px solid var(--line2)}
.qm-hh{font-size:13px;font-weight:600;color:var(--ink2);margin:4px 0}
.qm-h ol{list-style:none;margin:0;padding:0}
.qm-r{display:flex;gap:8px;padding:5px 0;border-top:1px dashed var(--line)}
.qm-r:first-child{border-top:0}
.qm-r.out{opacity:.45}
.qm-i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);font-size:12px;display:inline-flex;align-items:center;justify-content:center;margin-top:3px}
.qm-w,.qm-ay{font-family:"Amiri Quran","Noto Naskh Arabic",serif;font-size:18px;line-height:1.9}
.qm-ay{font-size:16px}
.qm-meta{font-size:12px;color:var(--muted)}
.qm-bad{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);font-weight:600}
.qm-mk{margin:4px 0 0;padding:6px 8px;border-radius:8px;background:var(--panel2);font-size:13px}
.qm-mk .x{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.qm-mk .ok{color:var(--ok);font-weight:600}
.qm-mlist{list-style:none;margin:0;padding:0}
.qm-mlist>li{padding:8px 0;border-top:1px solid var(--line)}
.qm-mlist>li:first-child{border-top:0}
.qm-jt{font-size:13px;font-weight:700;color:var(--sc,var(--accent));margin:10px 0 2px}
.qm-cands{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.qm-cand{text-align:start;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit}
.qm-cand.on{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 30%,transparent)}
.qm-cand .qm-ay{font-size:15px;line-height:1.8}
.qm-man{display:flex;gap:6px;margin-top:6px}
.qm-man select{flex:2} .qm-man input{flex:1;min-width:80px}
@media (min-width:900px){.qm-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.qm-s[open]{grid-column:1/-1}}
.qm-lv{display:inline-flex;gap:3px;flex:none}
.qm-rt{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.qm-rt .qm-lv{margin-top:6px}
.qm-sum{display:inline-flex;gap:4px;flex-wrap:wrap;margin-inline-start:auto}
.qm-dot{font-size:11.5px;padding:0 7px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.qm-dot.lv-good{color:#fff;background:var(--ok);border-color:transparent} .qm-dot.lv-mid{color:#fff;background:var(--warn);border-color:transparent} .qm-dot.lv-weak{color:#fff;background:var(--bad);border-color:transparent}
.qm-r.qm-flash{background:color-mix(in srgb,var(--sc,var(--accent)) 16%,transparent);border-radius:8px;transition:background .3s}
.qm-st-h{font-size:16px;margin:0 0 4px}
.qm-st-j{line-height:2;font-size:14px}
.qm-lv button{font:inherit;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer;line-height:1.7}
.qm-lv button.on{color:#fff;border-color:transparent;font-weight:600}
.qm-lv .lv-good.on{background:var(--ok)} .qm-lv .lv-mid.on{background:var(--warn)} .qm-lv .lv-weak.on{background:var(--bad)}
.qm-lvf button.lv-good.on{background:var(--ok);color:#fff;border-color:transparent} .qm-lvf button.lv-mid.on{background:var(--warn);color:#fff;border-color:transparent} .qm-lvf button.lv-weak.on{background:var(--bad);color:#fff;border-color:transparent}
.qm-lvf button.on .muted{color:inherit;opacity:.8}
.qm-st{padding:8px 10px;border-radius:10px;border:1px solid var(--line);border-inline-start:4px solid var(--line2);margin-top:6px}
.qm-st.lv-good{border-inline-start-color:var(--ok)} .qm-st.lv-mid{border-inline-start-color:var(--warn)} .qm-st.lv-weak{border-inline-start-color:var(--bad)}
.qm-st.lv-good b{color:var(--ok)} .qm-st.lv-mid b{color:var(--warn)} .qm-st.lv-weak b{color:var(--bad)}
.qm-st-l{margin-top:4px;line-height:2}

</style>
</head>

    return `<div class="small muted" style="margin-bottom:8px">ترتيب اليوم العلمي: ${esc(K.order)}. كل شيء هنا يتعدل من مكانه ويُحفظ مباشرة.</div><div class="grid g2">${E.K_TRACKS.map(([tr, name]) => { const its = K.items.filter(i => i.track === tr);
      return `<div class="card"><h2>${name} <span class="tag">${E.ar(its.length)}</span></h2><ul class="list">${its.map(item).join('') || '<li class="empty">لا شيء بعد.</li>'}</ul>
        <form class="row" data-form="k-add" data-track="${tr}" style="margin-top:8px"><input type="text" name="title" placeholder="إضافة إلى «${name}»" required style="flex:1"><button class="btn sm">إضافة</button></form></div>`; }).join('')}</div>`;

  V.books = () => {

    const wk = E.range(E.weekStart(today()), E.addDays(E.weekStart(today()), 6));

    const sec = (t, k) => `<div class="card"><h2>${t}</h2><ul class="list">${by(k).map(p => `<li><span style="flex:1">${esc(p.name)}<br><span class="muted small">${esc((p.notes || '').split('\n')[0])}</span></span><span class="tag">${{ 'In progress': 'جارٍ', 'Not started': 'لم يبدأ', Done: 'منتهٍ' }[p.status] || ''}</span><button class="btn sm" data-a="log" data-area="learning" data-proj="${esc(p.id)}">تسجيل</button></li>`).join('') || '<li class="empty">لا شيء</li>'}</ul></div>`;
    return `<div class="grid g2">${sec('دروس ألقيها (تعليم)', 'تعليم')}${sec('دروس أتلقاها', 'تلقي')}${sec('متون للحفظ', 'حفظ')}${sec('كتب للقراءة', 'قراءة')}${sec('مذاكرة مستقلة', 'مذاكرة مستقلة')}
      <div class="card"><h2>دروس وتسميع هذا الأسبوع (من التقويم)</h2><ul class="list">${lessons.map(e => `<li><span class="tag">${fmtDate(e.start.slice(0, 10))} ${e.start.slice(11, 16)}</span><span>${esc(e.title)}</span>${e.kind === 'flexible' ? '<span class="tag">مرن</span>' : ''}</li>`).join('')}</ul></div></div>`;
  };

  V.work = () => {
    const sales = Object.values(S.business.sales).sort((a, b) => a.date < b.date ? 1 : -1);
    const sum = f => sales.reduce((a, s) => a + (Number(s[f]) || 0), 0);
    const [ws, we] = E.periodRange('week', today());
    const workMin = S.logs.filter(l => l.area === 'work' && l.date >= ws && l.date <= we).reduce((a, l) => a + l.minutes, 0);

      <div class="card"><h2>المتبقي عند العملاء</h2><div class="big">${nf(sum('remaining'))}</div></div>
      <div class="card"><h2>ساعات الشغل هذا الأسبوع</h2><div class="big">${D(workMin)}</div><div class="bar"><i style="width:${Math.min(100, workMin / (goal ? goal.target : 1440) * 100)}%"></i></div><div class="muted small">المستهدف ${D(goal ? goal.target : 1440)}</div></div>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h2>المبيعات</h2><div class="tblwrap"><table><thead><tr><th>التاريخ</th><th>العميل</th><th>الصنف</th><th>المدفوع</th><th>الربح</th><th>الحالة</th></tr></thead><tbody>${sales.map(s => `<tr><td>${s.date}</td><td>${esc(s.client)}</td><td>${esc(s.item)}</td><td>${nf(s.paid)}</td><td>${nf(s.profit)}</td><td class="small">${esc(s.status)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><h2>الأصناف والأسعار</h2><div class="tblwrap"><table><thead><tr><th>الصنف</th><th>جملة</th><th>قطاعي</th></tr></thead><tbody>${S.business.items.map(i => `<tr><td>${esc(i.name)}</td><td>${nf(i.wholesale)}</td><td>${nf(i.retail)}</td></tr>`).join('')}</tbody></table></div>
        ${S.business.priceHistory.length ? `<div class="small" style="margin-top:6px"><strong>تغيرات الأسعار:</strong> ${S.business.priceHistory.map(p => { const cur = S.business.items.find(i => i.name.includes((p.item.split(' ').pop()))); return esc(`${p.item}: ${nf(p.wholesale)}/${nf(p.retail)} حتى ${p.validUntil}` + (cur ? ` ← الآن ${nf(cur.wholesale)}/${nf(cur.retail)}` : '')); }).join(' · ')}</div>` : ''}</div>
      <div class="card"><h2>العملاء</h2><ul class="list">${S.business.clients.map(c => { const cs = sales.filter(s => s.client === c.name); return `<li><span style="flex:1">${esc(c.name)}</span><span class="muted small">${cs.length} عملية · ${nf(cs.reduce((a, s) => a + s.paid, 0))} ج</span></li>`; }).join('')}</ul></div>
      <div class="card"><h2>دخل آخر (أعمال بحثية، مراجعة، تحقيق…)</h2>${S.income.length ? `<ul class="list">${S.income.map(x => `<li><span class="tag">${x.date}</span><span style="flex:1">${esc(x.source)} ${x.note ? '— ' + esc(x.note) : ''}</span><strong>${nf(x.amount)}</strong></li>`).join('')}</ul>` : '<div class="empty">لا توجد بيانات عن هذا الدخل في مصادرك؛ سجّله هنا.</div>'}
        <form id="income-form" class="form" style="margin-top:8px"><label class="f">التاريخ<input type="date" name="date" value="${today()}" required></label><label class="f">المصدر/العميل<input type="text" name="source" required></label><label class="f">المبلغ<input type="number" name="amount" min="0" required></label><label class="f">ملاحظة<input type="text" name="note"></label><button class="btn primary">إضافة</button></form></div>

      <div class="card"><h2>ملاحظات واحتياجات</h2><ul class="list">${S.familyNotes.map((n, i) => `<li><input type="checkbox" ${n.done ? 'checked' : ''} data-a="fam-done" data-i="${i}"><span style="flex:1">${esc(n.text)}</span><span class="muted small">${n.date}</span></li>`).join('') || '<li class="empty">لا شيء.</li>'}</ul>
        <form id="fam-form" class="row" style="margin-top:8px"><input type="text" name="text" placeholder="حاجة أو ملاحظة" required style="flex:1"><button class="btn">إضافة</button></form></div>
    </div>`;

  V.health = () => {

    const ens = S.energy.slice().sort((x, y) => (x.date + x.time) < (y.date + y.time) ? 1 : -1).slice(0, 14);
    setTimeout(() => chart('h-chart', { data: { labels: a.perDay.map(p => fmtDate(p.date)), datasets: [

      { type: 'line', label: 'الإنجاز الفعلي (ساعات)', data: a.perDay.map(p => p.achievement / 60), borderColor: '#2f7d5b', backgroundColor: '#2f7d5b', yAxisID: 'y' },
      { type: 'line', label: 'الطاقة', data: a.perDay.map(p => p.energy), borderColor: '#b07d2b', backgroundColor: '#b07d2b', borderDash: [4, 3], yAxisID: 'y1' }] },
      options: { scales: { y: { beginAtZero: true, title: { display: true, text: 'ساعات' } }, y1: { position: 'left', min: 0, max: 5, grid: { drawOnChartArea: false }, title: { display: true, text: 'طاقة' } } } } }));
    const sport = S.logs.filter(l => l.area === 'health' && l.date >= E.weekStart(d)).reduce((x, l) => x + l.minutes, 0);
    return `<div class="grid g2">

        <label class="f">التاريخ<input type="date" name="date" value="${d}" required></label><label class="f">الوقت<input type="time" name="time" value="${nowStamp().slice(11, 16)}"></label>

        <div class="small" style="margin-top:10px">الرياضة هذا الأسبوع: ${D(sport)} من ${D((S.goals.find(g => g.area === 'health') || {}).target || 0)} <button class="btn sm" data-a="log" data-area="health">تسجيل رياضة</button></div></div>
      <div class="card"><h2>أثر النوم والطاقة في الإنجاز (١٤ يومًا)</h2><div class="chartbox"><canvas id="h-chart" role="img" aria-label="النوم والطاقة والإنجاز"></canvas></div>
        <div class="small muted">${a.corrSleep == null ? `الارتباط يحتاج 3 أيام على الأقل من تسجيل النوم (المسجل ${a.nSleep}).` : `ارتباط النوم بالإنجاز: ${a.corrSleep.toFixed(2)}`} · ${a.corrEnergy == null ? `الطاقة: المسجل ${a.nEnergy} يوم.` : `ارتباط الطاقة بالإنجاز: ${a.corrEnergy.toFixed(2)}`}</div></div>
      <div class="card"><h2>آخر التسجيلات</h2>${ens.length ? `<ul class="list">${ens.map(e => `<li><span class="tag">${e.date} ${e.time || ''}</span><span>طاقة ${e.level}/5${e.sleepHours != null ? ' · نوم ' + e.sleepHours + ' س' : ''}${e.note ? ' · ' + esc(e.note) : ''}</span></li>`).join('')}</ul>` : '<div class="empty">لا تسجيلات بعد.</div>'}</div>
    </div>`;
  };

  V.time = (q) => {
    const kind = q.get('k') || 'week', [from, to] = E.periodRange(kind, today()), a = E.analyze(S, from, to, today(), nowMin());
    const keys = Object.keys(E.CATS);
    setTimeout(() => {
      chart('t-bar', { type: 'bar', data: { labels: keys.map(k => E.CATS[k]), datasets: [{ label: 'المخطط', data: keys.map(k => (a.planned[k] || 0) / 60), backgroundColor: '#c9c2b2' }, { label: 'الفعلي', data: keys.map(k => (a.actual[k] || 0) / 60), backgroundColor: keys.map(k => CAT_COLORS[k]) }] }, options: { indexAxis: 'y', scales: { x: { title: { display: true, text: 'ساعات' } } } } });
      const tot = keys.reduce((x, k) => x + (a.actual[k] || 0), 0);
      if (tot) chart('t-pie', { type: 'doughnut', data: { labels: keys.map(k => E.CATS[k]), datasets: [{ data: keys.map(k => (a.actual[k] || 0) / 60), backgroundColor: keys.map(k => CAT_COLORS[k]) }] } });
    });
    return `<div class="row noprint" style="margin-bottom:12px">${[['day', 'اليوم'], ['week', 'الأسبوع'], ['month', 'الشهر']].map(([k, n]) => `<a class="btn ${k === kind ? 'primary' : ''}" href="#time?k=${k}">${n}</a>`).join('')}<span class="muted small">${from} – ${to}</span></div>
    <div class="grid g2"><div class="card"><h2>المخطط مقابل الفعلي في الفئات الثماني</h2><div class="chartbox" style="height:320px"><canvas id="t-bar" role="img" aria-label="المخطط مقابل الفعلي"></canvas></div></div>
      <div class="card"><h2>أين ذهب الوقت المسجل؟</h2><div class="chartbox"><canvas id="t-pie" role="img" aria-label="توزيع الوقت"></canvas></div>${Object.values(a.actual).some(Boolean) ? '' : '<div class="empty">لا سجلات في هذه الفترة.</div>'}</div>
      <div class="card"><h2>الأرقام</h2><table><thead><tr><th>الفئة</th><th>مخطط</th><th>فعلي</th><th>الفرق</th></tr></thead><tbody>${keys.map(k => `<tr><td><span class="tag" style="border-color:${CAT_COLORS[k]}">${E.CATS[k]}</span></td><td>${D(a.planned[k] || 0)}</td><td>${D(a.actual[k] || 0)}</td><td>${(a.actual[k] || 0) - (a.planned[k] || 0) >= 0 ? '+' : '−'}${D(Math.abs((a.actual[k] || 0) - (a.planned[k] || 0)))}</td></tr>`).join('')}</tbody></table>
        <div class="small muted" style="margin-top:6px">الالتزام بالخطة: ${a.adherence == null ? '—' : Math.round(a.adherence * 100) + '%'} · وقت يقظة غير مسجل تقديريًا: ${D(a.untracked)}. النوم المخطط محسوب من حدك الأدنى.</div></div></div>`;
  };

  V.reports = (q) => {
    const kind = q.get('k') || 'week', anchor = q.get('d') || today();
    const r = E.reportText(S, kind, anchor, today(), nowMin()), a = r.analysis;
    setTimeout(() => {
      chart('r-days', { type: 'bar', data: { labels: a.perDay.map(p => fmtDate(p.date)), datasets: [{ label: 'مخطط (مهام)', data: a.perDay.map(p => p.plannedTasks / 60), backgroundColor: '#c9c2b2' }, { label: 'منجز', data: a.perDay.map(p => p.doneTasks / 60), backgroundColor: '#2f7d5b' }] }, options: { scales: { y: { title: { display: true, text: 'ساعات' } } } } });

    return `<div class="row noprint" style="margin-bottom:12px">${[['day', 'يومي'], ['week', 'أسبوعي'], ['month', 'شهري'], ['quarter', 'فصلي']].map(([k, n]) => `<a class="btn ${k === kind ? 'primary' : ''}" href="#reports?k=${k}&d=${anchor}">${n}</a>`).join('')}
      <input type="date" value="${anchor}" data-a="rep-date" data-k="${kind}" aria-label="تاريخ التقرير"><span style="flex:1"></span>
      <button class="btn" data-a="rep-print">طباعة / PDF</button><button class="btn" data-a="rep-txt">تنزيل نص</button><button class="btn" data-a="rep-csv">تنزيل السجل CSV</button></div>
    <div class="grid g2"><div class="card"><h2>نص التقرير</h2><pre class="rep" id="rep-text">${esc(r.text)}</pre></div>
      <div class="card"><h2>المخطط مقابل المنجز يوميًا</h2><div class="chartbox"><canvas id="r-days" role="img" aria-label="المخطط والمنجز يوميًا"></canvas></div></div></div>`;
  };

  /** «خريطة النظام»: how things flow, at the top of the settings page. */
  function systemMap() {
    const F = E.FILES.map(f => `<i style="--c:${f.color}">${esc(f.name)}</i>`).join('');
    return `<div class="card" style="margin-bottom:14px"><h2>خريطة النظام</h2><div class="smap">

        <div class="nd" style="--c:var(--info)"><b>تقويم جوجل</b><span>المواعيد بتنزل لوحدها بزرار ↻، والممسوح يتشال</span></div>
        <div class="nd" style="--c:var(--warn)"><b>رسالة الجروب</b><span>لصق ← دفعات بقوائمها، طلبات، وتنبيه العاجل</span></div>
        <div class="nd"><b>انت</b><span>زرار «المساعد»: مهمة، عملت، ضيّعت، فكرة</span></div></div></div>

        <div class="nd" style="--c:var(--c-worship)"><b>القرآن بالأرباع</b><span>القسمين ١ و٢ في ١٠ أيام، والجديد حزب للشيخ</span></div>

    if (a === 'wird-day') { const w = S.awrad[+t.dataset.i], k = +t.dataset.k, cur = w.days || [0, 1, 2, 3, 4, 5, 6]; const nd = t.checked ? [...new Set([...cur, k])].sort() : cur.filter(x => x !== k); w.days = nd.length === 7 ? undefined : nd; if (!w.days) delete w.days; if (w.id === 'w-sport') { const g = (S.bigGoals || []).find(x => x.id === 'g-sport'); if (g) { g.days = nd; E.syncGoalTasks(S); } } save(); return; }
    if (a === 'gs-chk') { E.checkGoalStep(S, t.dataset.g, t.dataset.id, t.checked); save(); render(); if (t.checked) toast('تمام ✓'); return; }
    if (a === 'bz-edit') { const it = (S.biz || []).find(x => x.id === t.dataset.id), f = t.dataset.f; if (!it) return;
      if (f === 'groups') it.groups = t.value.split(/[،,]/).map(x => x.trim()).filter(Boolean); else if (f === 'title') it.title = t.value.trim() || it.title; else it[f] = t.value.trim();
      save(); if (f !== 'notes') render(); return; }
    if (a === 'stu-edit') { const st = S.work2.students.find(x => x.id === t.dataset.id), f = t.dataset.f; st[f] = f === 'fee' ? +t.value || 0 : t.value.trim(); save(); return; }
    if (a === 'stu-part') { const st = S.work2.students.find(x => x.id === t.dataset.id), f = t.dataset.f; st.parts = t.checked ? [...new Set([...st.parts, f])] : st.parts.filter(x => x !== f); save(); return; }
    if (a === 'idea-edit') { const x = (S.ideas || []).find(y => y.id === t.dataset.id); if (x) { x.text = t.value.trim(); save(); } return; }
    if (a === 'pick-day') location.hash = 'day?d=' + t.value;
    else if (a === 'rep-date') location.hash = `reports?k=${t.dataset.k}&d=${t.value}`;
    else if (a === 'goal') { const g = S.goals[+t.dataset.i]; g[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? +t.value : t.value; save(); }
    else if (a === 'task-status') { S.tasks.find(x => x.id === t.dataset.id).status = t.value; save(); }
    else if (a === 'proj-status') { E.editLocal(S.projects[t.dataset.id], 'status', t.value); save(); render(); }
    else if (a === 'ms-done' || a === 'ms-due') { const phd = Object.values(S.projects).find(p => p.name === 'المشروع العلمي'); const m = S.milestones[phd.id][+t.dataset.i]; if (a === 'ms-done') m.done = t.checked; else m.due = t.value || null; save(); }
    else if (a === 'fam-done') { S.familyNotes[+t.dataset.i].done = t.checked; save(); }
    else if (a === 'ev-kind' || a === 'ev-area' || a === 'ev-skip') { for (const id of t.dataset.ids.split(',')) E.setEventMeta(S, id, a === 'ev-kind' ? { kind: t.value } : a === 'ev-area' ? { area: t.value } : { skip: t.checked }); save(); toast('سيُطبق في الخطط الجديدة'); }
    else if (a === 'import-snap' || a === 'restore') {
      const f = t.files[0]; if (!f) return; const rd = new FileReader();
      rd.onload = () => {
        try {
          const j = JSON.parse(rd.result);
          if (a === 'restore') { if (!j.schemaVersion || !j.settings) throw new Error('ليس ملف نسخة Life OS'); S = E.bootstrap(j, SNAP); save(); render(); toast('تمت الاستعادة'); }
          else { if (!j.calendar && !j.notion && !j.drive) throw new Error('الملف لا يحتوي calendar أو notion أو drive'); showSyncResult(E.applySnapshot(S, j, 'ملف ' + f.name)); save(); render(); }
        } catch (err) { toast('ملف غير صالح: ' + err.message); }
      }; rd.readAsText(f); t.value = '';
    }
  });
  document.addEventListener('submit', e => {
    const f = e.target, v = Object.fromEntries(new FormData(f));
    if (f.dataset.form) { e.preventDefault();
      if (f.dataset.form === 'g-add') { S.bigGoals.push({ id: E.uid('g'), file: f.dataset.file, title: v.title, status: 'archive', perWeek: 1, minutes: 60, days: null, energy: 'med', priority: 2, note: '' }); }
      if (f.dataset.form === 'gs-add') { E.addGoalStep(S, f.dataset.g, v.title); save(); render(); const n = document.querySelector(`form[data-form="gs-add"][data-g="${f.dataset.g}"] input`); if (n) n.focus(); return; }
      if (f.dataset.form === 'bz-goal') { E.addBizGoal(S, f.dataset.id, v.title, f.dataset.g);  }
      if (f.dataset.form === 'bz-add') E.addBizItem(S, f.dataset.part, v.title);
      if (f.dataset.form === 'wird-add') { const w = { id: E.uid('w'), title: v.title.trim() }; if ((v.time || '').trim()) w.time = v.time.trim(); S.awrad.push(w); }
      if (f.dataset.form === 'k-add') S.knowledge.items.push({ id: E.uid('k'), track: f.dataset.track, title: v.title, status: 'todo', when: '', prep: '', steps: [], note: '' });
      if (f.dataset.form === 'k-step-add') S.knowledge.items.find(x => x.id === f.dataset.id).steps.push({ t: v.t, done: false });
      if (f.dataset.form === 'stu-add') E.addStudent(S, { name: v.name, match: v.match || v.name, parts: Object.keys(E.T_PARTS).filter(k => v['p-' + k] === 'on'), fee: v.fee, cycle: v.cycle });
      if (f.dataset.form === 'ses') { const rng = k => v[k + '-s'] ? { s: +v[k + '-s'], from: +v[k + '-from'] || null, to: +v[k + '-to'] || null } : (v[k + '-text'] || '').trim() ? { text: v[k + '-text'].trim() } : null;
        const st = S.work2.students.find(x => x.id === f.dataset.id), x = E.addSession(S, st.id, { date: v.date, hifz: rng('hifz'), review: rng('review'), hadith: (v.hadith || '').trim(), tafsir: (v.tafsir || '').trim(), level: v.level || null, next: (v.next || '').trim() });
        const pos = E.sessionPos(st, x); closeModal(); save(); render(); toast(pos.n === st.cycle ? `خلصت الدورة ${E.ar(pos.cycle)}، الملخص جاهز` : `اتسجلت الحصة ${E.ar(pos.n)} من ${E.ar(st.cycle)}`); return; }
      if (f.dataset.form === 'idea-add') { E.addIdea(S, v.text, v.cat, today()); toast('اتحفظت'); }
      if (f.dataset.form === 'pricing-set') { const P = E.setPricing(S, v.text); toast(`اتحفظت: ${P.refs.length} سعر`); }
      if (f.dataset.form === 'price-add') { const P = E.addPriceRef(S, v.service, v.price, v.unit, v.proposed === 'on'); toast(`اتضاف · القاعدة فيها ${E.ar(P.refs.length)} سعر`); }
      if (f.dataset.form === 'price-est') { const o = $('#price-out'); o.innerHTML = priceHTML(v.text); return; }
      if (f.dataset.form === 'gcid') { S.settings.googleClientId = v.gcid.trim(); toast('اتحفظ'); }
      if (f.dataset.form === 'sleep' && !E.addSleep(S, today(), v.from, v.to)) toast('وقت النوم والصحيان لازم يختلفوا');
      if (f.dataset.form === 'st-add') E.addStep(S, f.dataset.p, v.title.trim(), v.when);
      if (f.dataset.form === 'pj-add') E.addProject(S, v.title.trim());
      if (f.dataset.form === 'qpos') { const C = E.quranDay(S, today()).Cunits, n = +v.q; S.qplan.ismailQ = n ? n : Math.min(...C) - 1; }
      save(); render(); return; }
    if (f.id === 'task-form') { e.preventDefault(); const days = new FormData(f).getAll('rd').map(Number);
      S.tasks.push({ id: E.uid('t'), title: v.title, area: v.area, duration: +v.duration, priority: +v.priority, energy: v.energy, due: v.due || null, projectRef: v.projectRef || null, recurrence: days.length ? { days } : null, status: 'active', source: 'يدوي' }); save(); render(); toast('أُضيفت المهمة'); }
    else if (f.id === 'ms-form') { e.preventDefault(); const phd = Object.values(S.projects).find(p => p.name === 'المشروع العلمي'); S.milestones[phd.id].push({ id: E.uid('ms'), name: v.name, due: v.due || null, done: false }); save(); render(); }
    else if (f.id === 'income-form') { e.preventDefault(); S.income.push({ id: E.uid('in'), date: v.date, source: v.source, amount: +v.amount, note: v.note }); save(); render(); }
    else if (f.id === 'fam-form') { e.preventDefault(); S.familyNotes.push({ text: v.text, date: today(), done: false }); save(); render(); }
    else if (f.id === 'energy-form') { e.preventDefault(); E.addEnergy(S, { date: v.date, time: v.time, level: +v.level, sleepHours: v.sleepHours === '' ? null : +v.sleepHours, note: v.note }); save(); render(); toast('حُفظ'); }
    else if (f.id === 'settings-form') { e.preventDefault(); const st = S.settings; Object.assign(st, { city: v.city, lat: +v.lat, lon: +v.lon, dayStart: v.dayStart, sleepTime: v.sleepTime, minSleepHours: +v.minSleepHours, maxDailyTasks: +v.maxDailyTasks });
      st.quran.weekdayStart = v.q1; st.quran.weekendStart = v.q2; st.quran.minutes = +v.qm; st.work.minutesPerDay = +v.wm; save(); render(); toast('حُفظت الإعدادات؛ ولّد خطة جديدة لتطبيقها'); }
    else if (f.id === 'newev-form') { e.preventDefault(); const st = v.start.replace(' ', 'T').slice(0, 16), d = new Date(st); d.setMinutes(d.getMinutes() + (+v.minutes));
      S.outbox.push({ id: E.uid('ob'), target: 'gcal', action: 'create', status: 'pending', createdAt: new Date().toISOString(), summary: `إنشاء موعد «${v.title}» ${st.replace('T', ' ')}`, payload: { title: v.title, start: st, end: E.localStamp(d) } }); save(); render(); }
  });
  async function approveOutbox(id) {
    const o = S.outbox.find(x => x.id === id); if (!o) return;
    try {
      const r = await fetch('api/calendar/' + o.action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ approved: true }, o.payload)) });
      const j = await r.json(); if (!r.ok || j.error) throw new Error(j.error || r.status);
      o.status = 'sent'; o.result = j; S.sync.log.unshift({ id: E.uid('sync'), at: new Date().toISOString(), source: 'Google Calendar', action: 'كتابة بموافقتك', counts: { sent: 1 }, details: [o.summary] });
      save(); render(); toast('أُرسل إلى التقويم');
    } catch (e) { toast('لم يُرسل: ' + e.message); }
  }
  /** One-tap import of the product price list from a link sent in chat (the list never sits in the public code). */
  function takeProducts() {
    if (!/^#products=/.test(location.hash)) return false;
    try {
      const b = location.hash.slice(10).replace(/-/g, '+').replace(/_/g, '/'), rows = JSON.parse(decodeURIComponent(escape(atob(b))));
      const P = rows.map(([name, cost, price]) => ({ name, cost: +cost || 0, price: +price || 0 }));
      history.replaceState(null, '', location.pathname + location.search + '#file?f=work');
      if (confirm(`أحفظ قائمة المنتجات (${E.ar(P.length)} صنف) بأسعار البيع والجملة؟`)) { S.work2.products = P; save(); toast('اتحفظت قائمة المنتجات'); }
    } catch (e) { history.replaceState(null, '', location.pathname + location.search + '#today'); toast('الرابط ده مش سليم'); }
    render(); return true;
  }
  /** One tap from a link Claude sends: «#pricing=…» carries the pricing base; it is stored on this device and the link is cleared. */
  function takePricing() {
    if (!/^#pricing=/.test(location.hash)) return false;
    try {
      const b = location.hash.slice(9).replace(/-/g, '+').replace(/_/g, '/'), text = decodeURIComponent(escape(atob(b)));
      history.replaceState(null, '', location.pathname + location.search + '#file?f=work');
      const P = E.setPricing(S, text); save(); toast(`اتحفظت قاعدة الأسعار: ${E.ar(P.refs.length)} سعر`);
    } catch (e) { history.replaceState(null, '', location.pathname + location.search + '#today'); toast('الرابط ده مش سليم'); }
    render(); return true;
  }
  window.addEventListener('hashchange', () => { if (takeProducts() || takePricing() || takeStudents()) return; if (location.hash === '#sync') { history.replaceState(null, '', location.pathname + location.search + '#today'); render(); syncCalendarLive(); } else render(); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ------------------------------------------------------------- shell
  function updateSaveBadge() { const b = $('#savebadge'); if (b) { b.className = 'pill ' + (Store.error ? 'bad' : 'ok'); b.textContent = Store.error || 'محفوظ'; } }
  function render() {
    while (charts.length) charts.pop().destroy();
    const r = route(), q = new URLSearchParams(location.hash.split('?')[1] || ''), sec = SECTIONS.find(s => s[0] === r) || SECTIONS[0];
    const navOn = MAIN.some(m => m[0] === sec[0]) ? sec[0] : sec[0] === 'goals2' || sec[0] === 'report' || sec[0] === 'file' || sec[0] === 'appts' || ['quran', 'phd', 'books', 'work', 'projects', 'family', 'health', 'ideas'].includes(sec[0]) ? 'files' : sec[0] === 'day' ? 'today' : sec[0] === 'reports' || sec[0] === 'time' ? 'report' : 'today';
    $('#nav').innerHTML = MAIN.map(([id, name]) => `<a href="#${id}" class="${id === navOn ? 'on' : ''}"><span class="n">${NAV_ICON[id]}</span>${name}</a>`).join('');
    $('#title').textContent = sec[0] === 'file' ? ((E.FILES.find(f => f.id === q.get('f')) || {}).name || 'الملف') : sec[1];
    $('#today').textContent = `${fmtDate(today())} · ${nowStamp().slice(11, 16)}`;
    let html; try { html = V[sec[0]](q); } catch (err) { console.error(err); html = `<div class="card"><h2>تعذر عرض القسم</h2><pre class="small">${esc(err.stack || err)}</pre></div>`; }
    $('#view').innerHTML = html; to12($('#view')); to12($('.top'));
    $('#view').dataset.s = sec[0] === 'file' ? ((E.FILES.find(f => f.id === q.get('f')) || E.FILES[0]).id) : '';
    $('.top').dataset.s = $('#view').dataset.s;
    $('.side').classList.remove('open');
    updateSaveBadge();
  }
  async function boot() {
    try { const th = localStorage.getItem('lifeos-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { }
    document.body.innerHTML = `<div class="app"><aside class="side"><div class="brand"><span class="dot"></span>Life OS</div><nav class="nav" id="nav" aria-label="الأقسام"></nav></aside>
      <main class="main"><div class="top"><button class="btn menu-btn" data-a="menu" aria-label="القائمة">☰</button><h1 id="title"></h1><span class="pill" id="today"></span><span class="pill" id="savebadge">…</span></div><div id="view"></div></main></div>
      <button class="btn primary fab" data-a="assistant">المساعد</button>`;
    await Store.open();
    const gBack = takeGoogleReturn();
    S = E.bootstrap(await Store.load(), SNAP);
    save(); render();
    if (gBack && lsGet('lifeos-after') === 'backup') { lsSet('lifeos-after', null); driveBackup(tokenNow()); }
    else if (calQueue().length && tokenNow()) calPush(); // an edit waiting for Google goes first, then the calendar is read again
    else if (gBack) syncCalendarLive(Date.now() - (lsGet('lifeos-auto-try') || 0) < 5 * 60000);
    else if (takeProducts() || takePricing() || takeStudents()) {}
    else if (location.hash === '#sync') { history.replaceState(null, '', location.pathname + location.search + '#today'); render(); syncCalendarLive(); }
    else if (autoCalendar(true)) {}
    else if (tokenNow() && (!S.sync.lastDrive || S.sync.lastDrive.slice(0, 10) !== today())) driveBackup(tokenNow(), true);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !$('#modal')) autoCalendar(false); });
    setInterval(() => { if (!$('#modal') && route() === 'home') render(); }, 60000);
    if ((Store.mode === 'server' || location.protocol === 'https:') && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { }); // installed copy works offline
    window.addEventListener('pagehide', () => { try { S.savedAt = new Date().toISOString(); localStorage.setItem('lifeos-state', JSON.stringify(S)); } catch (e) { } });
    window.__lifeos = { get state() { return S; }, E, Store, render, save, modal, closeModal, toast, today, tokenNow, getToken };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
